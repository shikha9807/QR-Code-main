<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mark Attendance - QR Portal</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem;">
  
  <div class="container container-narrow">
    <div class="card" style="padding: 2.5rem 2rem;">
      
      <!-- Top Branding -->
      <div style="text-align: center; margin-bottom: 2rem;">
        <div class="brand-badge" style="width: 56px; height: 56px; font-size: 1.8rem; margin: 0 auto 1rem; border-radius: 14px;">
          <i class="fa-solid fa-id-card-clip"></i>
        </div>
        <h1 style="font-size: 1.65rem; font-weight: 800; color: #ffffff; letter-spacing: -0.02em;">
          Student Attendance
        </h1>
        <p style="color: var(--text-muted); font-size: 0.92rem; margin-top: 0.35rem;">
          Session Verified &bull; Enter your details to confirm your attendance
        </p>
      </div>

      <!-- Session Info Pill -->
      <div style="margin-bottom: 1.75rem; padding: 0.85rem 1rem; background: rgba(99, 102, 241, 0.08); border: 1px solid rgba(99, 102, 241, 0.2); border-radius: var(--radius-md); display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem;">
        <span style="color: var(--text-muted);">
          <i class="fa-regular fa-clock"></i> Active Session
        </span>
        <span style="color: #38bdf8; font-weight: 700; font-family: var(--font-mono);">
          Session #{{ current_session.id }}
        </span>
      </div>

      <!-- Submission Form -->
      <form method="POST" action="{{ url_for('mark_attendance', token=token) }}">
        <div class="form-group">
          <label class="form-label" for="student_name">
            <i class="fa-solid fa-user-graduate"></i> Full Name or Student / Roll ID
          </label>
          <input 
            type="text" 
            id="student_name" 
            name="student_name" 
            class="form-control" 
            placeholder="e.g. John Doe (CS-2024-042)" 
            required 
            autofocus
            autocomplete="name"
          >
        </div>

        <div style="margin-top: 0.5rem; margin-bottom: 1.5rem; font-size: 0.8rem; color: var(--text-dim); display: flex; align-items: center; gap: 0.4rem;">
          <i class="fa-solid fa-shield-halved" style="color: var(--primary);"></i>
          <span>Single submission enforced per device.</span>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">
          <i class="fa-solid fa-check"></i> Submit Attendance
        </button>
      </form>

    </div>
  </div>

</body>
</html>
